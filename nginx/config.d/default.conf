server {
    listen 80;
    server_name lab.nokanguyen.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name lab.nokanguyen.com;

    ssl_certificate /etc/letsencrypt/live/lab.nokanguyen.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lab.nokanguyen.com/privkey.pem;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }
}