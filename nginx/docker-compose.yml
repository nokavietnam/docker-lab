services:
  nginx:
    image: nginx:alpine
    container_name: lab-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Chỉ cần mount thư mục chứa các file virtual host / reverse proxy
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./html:/usr/share/nginx/html:ro
      - ./logs:/var/log/nginx
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M