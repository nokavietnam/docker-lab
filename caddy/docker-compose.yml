services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - lab-network
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M

volumes:
  caddy_data:
  caddy_config:

networks:
  lab-network:
    external: true