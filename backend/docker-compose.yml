services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lab-backend
    restart: unless-stopped
    # networks:
      # - lab-network
    ports:
      - "9090:9090"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
        reservations:
          memory: 32M

networks:
  lab-network:
    external: true
